<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMBITEC Data - Previsão Diária 10 Dias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-green: #1b4332;
            --secondary-green: #40916c;
            --bg-light: #f8fafc;
        }
        body { background-color: var(--bg-light); font-family: 'Inter', sans-serif; }
        .header-agro { background-color: var(--primary-green); }
        .data-card { background: #ffffff; border-left: 4px solid var(--secondary-green); transition: transform 0.2s; }
        .data-card:hover { transform: translateY(-2px); }
        .card-temp-max { border-color: #ef4444; }
        .card-temp-min { border-color: #3b82f6; }
        .card-rain { border-color: #10b981; }
        select:disabled { cursor: not-allowed; opacity: 0.6; }
        .btn-voltar { background-color: #475569; transition: all 0.3s; }
        .btn-voltar:hover { background-color: #1e293b; }
        .btn-csv { background-color: var(--secondary-green); transition: all 0.3s; }
        .btn-csv:hover { background-color: var(--primary-green); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden border border-gray-100">
        <!-- Cabeçalho Estilo Agro -->
        <div class="header-agro p-6 text-white flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold italic flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    GAMBITEC Data
                </h1>
                <p class="text-green-200 text-sm font-medium">Previsão Diária Consolidada - Próximos 10 Dias</p>
            </div>
            <div id="areaVoltar" class="mt-4 md:mt-0 flex gap-2">
                <button id="btnDownloadCSV" onclick="exportToCSV()" class="hidden btn-csv text-white px-4 py-2 rounded-lg font-bold shadow-md flex items-center gap-2 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Exportar CSV
                </button>
                <button onclick="redirectToExternal()" class="btn-voltar text-white px-6 py-2 rounded-lg font-bold shadow-md flex items-center gap-2">
                    Portal
                </button>
            </div>
        </div>

        <div class="p-6">
            <!-- Área de Seleção -->
            <div id="selectionArea" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase mb-1">Estado (UF) ou País</label>
                    <select id="stateSelect" onchange="fetchCities()" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-green-600 outline-none transition-all">
                        <option value="">Selecione...</option>
                        <option value="PY">Paraguai (PY)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase mb-1">Município</label>
                    <select id="citySelect" onchange="fetchMeteoData()" disabled class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-green-600 outline-none transition-all">
                        <option value="">Selecione o Estado primeiro...</option>
                    </select>
                </div>
            </div>

            <!-- Resultados -->
            <div id="results" class="hidden space-y-6 animate-fade-in">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Temperaturas Extremas -->
                    <div class="data-card card-temp-max p-5 rounded-lg shadow-sm">
                        <h3 class="text-gray-500 text-xs font-black uppercase mb-2">Máxima do Período</h3>
                        <p id="maxTempPeriod" class="text-3xl font-black text-red-600">--</p>
                        <p class="text-[10px] text-gray-400 uppercase mt-1">Pico de Calor</p>
                    </div>

                    <div class="data-card card-temp-min p-5 rounded-lg shadow-sm">
                        <h3 class="text-gray-500 text-xs font-black uppercase mb-2">Mínima do Período</h3>
                        <p id="minTempPeriod" class="text-3xl font-black text-blue-600">--</p>
                        <p class="text-[10px] text-gray-400 uppercase mt-1">Risco de Geada/Frio</p>
                    </div>

                    <!-- Chuva -->
                    <div class="data-card card-rain p-5 rounded-lg shadow-sm">
                        <h3 class="text-gray-500 text-xs font-black uppercase mb-2">Precipitação Total</h3>
                        <p id="totalRain" class="text-3xl font-black text-emerald-700">--</p>
                        <p class="text-[10px] text-gray-400 uppercase mt-1">Acumulado 10 Dias</p>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 border border-gray-200 rounded-xl">
                    <p class="text-[10px] text-gray-500 uppercase font-black tracking-widest text-center mb-4">Gráfico Diário: Tendência para Próximos 10 Dias</p>
                    <div class="h-[300px]">
                        <canvas id="weatherChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="status" class="mt-4 text-center text-xs font-bold text-gray-400 uppercase"></div>
        </div>
    </div>

    <script>
        let chartInstance = null;
        let lastProcessedData = null;
        const stateSelect = document.getElementById('stateSelect');
        const citySelect = document.getElementById('citySelect');

        const pyCities = ["Asunción", "Ciudad del Este", "Encarnación", "Luque", "Pedro Juan Caballero", "San Lorenzo", "Lambaré", "Fernando de la Mora", "Limpio", "Mariano Roque Alonso", "Capiatá", "Villa Elisa", "Itauguá", "Salto del Guairá", "Caaguazú", "Coronel Oviedo"];

        function redirectToExternal() {
            window.location.href = "https://fcoliveira-utfpr.github.io/agrometeorologia/index.html";
        }

        async function loadStates() {
            try {
                const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
                const states = await response.json();
                states.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state.sigla; option.textContent = state.nome;
                    stateSelect.appendChild(option);
                });
                stateSelect.value = "PR";
                await fetchCities("Santa Helena");
            } catch (err) { console.error(err); }
        }

        async function fetchCities(defaultCityName = null) {
            const uf = stateSelect.value;
            if (!uf) { citySelect.disabled = true; return; }
            citySelect.disabled = true;
            citySelect.innerHTML = '<option value="">A carregar...</option>';

            try {
                if (uf === "PY") {
                    citySelect.innerHTML = '<option value="">Selecione cidade (PY)...</option>';
                    pyCities.sort().forEach(city => {
                        const option = document.createElement('option');
                        option.value = city; option.textContent = city;
                        citySelect.appendChild(option);
                    });
                } else {
                    const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);
                    const cities = await response.json();
                    citySelect.innerHTML = '<option value="">Selecione município...</option>';
                    cities.forEach(city => {
                        const option = document.createElement('option');
                        option.value = city.nome; option.textContent = city.nome;
                        citySelect.appendChild(option);
                    });
                }
                citySelect.disabled = false;
                if (defaultCityName) { citySelect.value = defaultCityName; fetchMeteoData(); }
            } catch (err) { console.error(err); }
        }

        async function fetchMeteoData() {
            const cityName = citySelect.value;
            const uf = stateSelect.value;
            if (!cityName || !uf) return;

            document.getElementById('status').innerText = `Consultando previsão diária para ${cityName}...`;
            
            try {
                const countryCode = uf === "PY" ? "PY" : "BR";
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=5&language=pt&format=json`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();
                const location = geoData.results?.find(r => r.country_code === countryCode) || geoData.results?.[0];

                if (!location) throw new Error("Localização não encontrada.");

                // Requisição DIÁRIA (daily)
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&forecast_days=10&timezone=auto`;
                const weatherRes = await fetch(weatherUrl);
                const weatherData = await weatherRes.json();

                processDailyResults(weatherData.daily);
            } catch (err) {
                document.getElementById('status').innerText = "Erro: " + err.message;
            }
        }

        function processDailyResults(daily) {
            const days = daily.time;
            const maxTemps = daily.temperature_2m_max;
            const minTemps = daily.temperature_2m_min;
            const rainSums = daily.precipitation_sum;
            const rainProbs = daily.precipitation_probability_max;

            lastProcessedData = { days, maxTemps, minTemps, rainSums, rainProbs, cityName: citySelect.value };

            const labels = days.map(d => {
                const date = new Date(d + 'T00:00:00');
                return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            });

            document.getElementById('maxTempPeriod').innerText = `${Math.max(...maxTemps).toFixed(1)}°C`;
            document.getElementById('minTempPeriod').innerText = `${Math.min(...minTemps).toFixed(1)}°C`;
            document.getElementById('totalRain').innerText = `${rainSums.reduce((a, b) => a + b, 0).toFixed(1)} mm`;
            
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('btnDownloadCSV').classList.remove('hidden');
            document.getElementById('status').innerText = "Previsão Diária Sincronizada.";
            
            renderChart(labels, maxTemps, minTemps, rainSums, rainProbs);
        }

        function renderChart(labels, maxTemps, minTemps, rainSums, rainProbs) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'line',
                            label: 'Máxima (°C)',
                            data: maxTemps,
                            borderColor: '#ef4444',
                            backgroundColor: '#ef444422',
                            tension: 0.3,
                            fill: false,
                            pointRadius: 4,
                            yAxisID: 'yTemp'
                        },
                        {
                            type: 'line',
                            label: 'Mínima (°C)',
                            data: minTemps,
                            borderColor: '#3b82f6',
                            backgroundColor: '#3b82f622',
                            tension: 0.3,
                            fill: false,
                            pointRadius: 4,
                            yAxisID: 'yTemp'
                        },
                        {
                            type: 'bar',
                            label: 'Chuva (mm)',
                            data: rainSums,
                            backgroundColor: '#10b981',
                            borderRadius: 4,
                            yAxisID: 'yRain'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        yTemp: {
                            type: 'linear',
                            position: 'left',
                            title: { display: true, text: 'Temp (°C)', font: { weight: 'bold' } }
                        },
                        yRain: {
                            type: 'linear',
                            position: 'right',
                            title: { display: true, text: 'Chuva (mm)', font: { weight: 'bold' } },
                            grid: { drawOnChartArea: false }
                        }
                    },
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                afterBody: (context) => {
                                    const index = context[0].dataIndex;
                                    return `Prob. Chuva: ${rainProbs[index]}%`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function exportToCSV() {
            if (!lastProcessedData) return;
            const { days, maxTemps, minTemps, rainSums, rainProbs, cityName } = lastProcessedData;
            let csv = "\ufeffData;Temp Max(C);Temp Min(C);Chuva(mm);Probabilidade(%)\n";
            days.forEach((d, i) => {
                csv += `${d};${maxTemps[i]};${minTemps[i]};${rainSums[i]};${rainProbs[i]}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `previsao_diaria_${cityName.replace(/\s+/g, '_')}.csv`;
            link.click();
        }

        window.onload = loadStates;
    </script>
</body>
</html>
