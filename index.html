<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMBITEC Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; }
        .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(229,231,235,0.5); }
        #map { height: 540px; width: 100%; border-radius: 8px; z-index: 1; }
        .info-map { padding: 8px 12px; font: 13px/15px 'Inter',sans-serif; background: rgba(255,255,255,0.97); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid #e5e7eb; max-width: 180px; }
        .legend-map { line-height: 22px; color: #333; }
        .color-bar { width: 18px; height: 90px; float: left; margin-right: 8px; border: 1px solid #333; border-radius: 4px; }
        .legend-labels { display: flex; flex-direction: column; justify-content: space-between; height: 90px; font-size: 11px; font-weight: 600; }
        .custom-tooltip { background: white; border: 1px solid #10b981; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); font-family: 'Inter',sans-serif; font-size: 12px; }
        #loading-screen { position: fixed; inset: 0; background: rgba(255,255,255,0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 48px; height: 48px; border: 4px solid #d1fae5; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<div id="loading-screen">
    <div class="spinner"></div>
    <p style="margin-top:16px;font-weight:700;color:#065f46;font-size:17px">GAMBITEC Data</p>
    <p style="color:#6b7280;font-size:13px;margin-top:4px" id="load-msg">A carregar dados climáticos...</p>
</div>

<header class="bg-emerald-800 text-white px-4 py-3 shadow-lg sticky top-0 z-50 relative">
    <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="leaf" class="w-8 h-8 text-emerald-300"></i>
            <div>
                <h1 class="text-lg font-bold tracking-tight">GAMBITEC Data</h1>
                <p class="text-emerald-200 text-xs">Monitoramento Agrometeorológico</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="hidden sm:flex items-center gap-1.5 bg-emerald-900/50 px-3 py-1.5 rounded-full border border-emerald-700/50">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></div>
                <span class="text-[9px] font-bold uppercase tracking-widest text-emerald-200">Sistema Ativo</span>
            </div>
            <button id="menu-toggle-btn" onclick="toggleMenu()" class="p-1.5 px-3 bg-emerald-900 border border-emerald-700 rounded-lg text-emerald-100 hover:bg-emerald-700 transition-all flex items-center gap-1.5 text-sm font-bold">
                MENU <i data-lucide="menu" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
    <div id="main-menu" class="hidden absolute top-full right-4 mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[100]">
        <div class="p-2 flex flex-col gap-1">
            <button onclick="toggleMenu()" class="w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="map" class="w-4 h-4"></i> Normais Climatológicas
            </button>
            <button onclick="window.location.href='previsao.html'" class="w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="cloud-sun" class="w-4 h-4"></i> Previsão do Tempo
            </button>
            <button onclick="window.location.href='setedias.html'" class="w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="calendar-days" class="w-4 h-4"></i> Monitoramento 7 dias
            </button>
            <button onclick="window.location.href='nasapower.html'" class="w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="satellite" class="w-4 h-4"></i> Dados NASA-POWER
            </button>
            <button onclick="window.location.href='simeparsh.html'" class="w-full text-left px-3 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl flex items-center gap-2 font-semibold text-sm">
                <i data-lucide="droplets" class="w-4 h-4"></i> SIMEPAR SH
            </button>
        </div>
    </div>
</header>

<main class="container mx-auto p-3 md:p-5">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div class="lg:col-span-1">
            <div class="glass-card p-4 rounded-2xl shadow-sm border-t-4 border-t-emerald-600">
                <h2 class="text-sm font-bold mb-3 text-slate-800 flex items-center gap-2 border-b pb-2">
                    <i data-lucide="map-pin" class="w-4 h-4 text-emerald-600"></i> Parâmetros
                </h2>
                <label class="block mb-1 text-xs font-bold text-slate-500 uppercase">Estado (UF):</label>
                <select id="stateSelect" class="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700 text-sm mb-3">
                    <option value="AC">Acre</option><option value="AL">Alagoas</option>
                    <option value="AM">Amazonas</option><option value="AP">Amapá</option>
                    <option value="BA">Bahia</option><option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option><option value="MA">Maranhão</option>
                    <option value="MG">Minas Gerais</option><option value="MS">Mato Grosso do Sul</option>
                    <option value="MT">Mato Grosso</option><option value="PA">Pará</option>
                    <option value="PB">Paraíba</option><option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option><option value="PR" selected>Paraná</option>
                    <option value="RJ">Rio de Janeiro</option><option value="RN">Rio Grande do Norte</option>
                    <option value="RO">Rondônia</option><option value="RR">Roraima</option>
                    <option value="RS">Rio Grande do Sul</option><option value="SC">Santa Catarina</option>
                    <option value="SE">Sergipe</option><option value="SP">São Paulo</option>
                    <option value="TO">Tocantins</option>
                </select>
                <label class="block mb-1 text-xs font-bold text-slate-500 uppercase">Variável:</label>
                <select id="varSelect" class="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700 text-sm">
                    <option value="PR" selected>Precipitação Acumulada</option>
                    <option value="PET">Evapotranspiração ETP</option>
                    <option value="TMED">Temperatura Média Anual</option>
                    <option value="KOPPEN">Classificação Köppen</option>
                    <option value="DTA">Disp. Total de Água (DTA)</option>
                </select>
                <div class="mt-4 space-y-2">
                    <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3">
                        <h4 class="text-[10px] font-black text-emerald-800 uppercase tracking-widest mb-1">Fonte de Dados</h4>
                        <p class="text-[10px] text-emerald-600 leading-relaxed">
                            Köppen (Alvares et al., 2013)<br>
                            Normais 1991–2020 (TerraClimate)<br>
                            DTA mm/m (Atlas Irrigação, 2021)<br>
                            Malha: IBGE via geodata-br
                        </p>
                    </div>
                    <div id="map-status" class="text-[10px] text-center py-1.5 px-2 rounded-lg font-bold bg-slate-100 text-slate-500">
                        A aguardar...
                    </div>
                </div>
            </div>
        </div>
        <div class="lg:col-span-3">
            <div class="glass-card p-2 rounded-2xl shadow-sm border border-slate-200">
                <div id="map"></div>
            </div>
        </div>
    </div>
</main>

<script>
// ==========================================
// MAPEAMENTO UF → código IBGE (2 dígitos)
// usado para montar URL do GeoJSON alternativo
// ==========================================
const UF_CODE = {
    AC:12,AL:27,AM:13,AP:16,BA:29,CE:23,DF:53,ES:32,
    GO:52,MA:21,MG:31,MS:50,MT:51,PA:15,PB:25,PE:26,
    PI:22,PR:41,RJ:33,RN:24,RO:11,RR:14,RS:43,SC:42,
    SE:28,SP:35,TO:17
};

// GeoJSON hospedado no GitHub — 200 OK, sem CORS, sem IBGE
// propriedade: feature.properties.id = código IBGE 7 dígitos (string)
// propriedade: feature.properties.name = nome do município
const GEO_URL = (uf) =>
    `https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-${UF_CODE[uf]}-mun.json`;

const PR_PET_CSV_URL     = "https://raw.githubusercontent.com/fcoliveira-utfpr/agrometeorologia/refs/heads/main/terraclimate_pet_normal_brasil.csv";
const CLIMA_SOLO_LOC_URL = "https://raw.githubusercontent.com/fcoliveira-utfpr/agrometeorologia/refs/heads/main/clima_solo_local.csv";
const CLIMA_SOLO_BR_URL  = "https://raw.githubusercontent.com/fcoliveira-utfpr/agrometeorologia/refs/heads/main/clima_solo_br.csv";

let map, geojsonLayer;
let codeToDataPR  = new Map();
let codeToDataBr  = new Map();
let codeToDataLoc = new Map();
let csvLoaded = false;
let currentMapUf  = "PR";
let currentMapVar = "PR";

// ==========================================
// UTILIDADES
// ==========================================
function setMsg(t)  { const e=document.getElementById('load-msg');    if(e) e.textContent=t; }
function hideLoad() { const e=document.getElementById('loading-screen'); if(e) e.style.display='none'; }
function setStatus(t,c){ const e=document.getElementById('map-status'); if(e){e.textContent=t;e.className=`text-[10px] text-center py-1.5 px-2 rounded-lg font-bold ${c}`;}}

function parseBR(v) {
    if(v===null||v===undefined||v==='') return NaN;
    let s=v.toString().trim();
    if(s.includes(',')&&s.includes('.'))
        s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
    else if(s.includes(',')) s=s.replace(',','.');
    return parseFloat(s);
}
const findKey    = (row,fn) => Object.keys(row).find(k=>fn(k.toLowerCase().trim()));
const findIbge   = row => findKey(row, k=>k.includes('ibge'));
const findEstado = row => findKey(row, k=>['estado','uf','estados'].includes(k));
const findMun    = row => findKey(row, k=>k.includes('munic')||k.includes('cidade'));

// ==========================================
// MENU
// ==========================================
function toggleMenu(){ document.getElementById('main-menu').classList.toggle('hidden'); }
document.addEventListener('click',e=>{
    const m=document.getElementById('main-menu'),b=document.getElementById('menu-toggle-btn');
    if(m&&!m.classList.contains('hidden')&&!m.contains(e.target)&&!b.contains(e.target)) m.classList.add('hidden');
});

// ==========================================
// INIT MAPA
// ==========================================
function initMap(){
    map=L.map('map').setView([-24.5,-51.0],6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        {attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
}

// ==========================================
// CARGA CSVs — indexados por IBGE-Code
// ==========================================
function loadAllCsvs(){
    setMsg('A carregar CSV de Precipitação/ETP...');
    let done=0;
    const onDone=()=>{ if(++done===3){ csvLoaded=true; processMapData(); }};

    Papa.parse(PR_PET_CSV_URL,{download:true,header:true,skipEmptyLines:true,
        complete:res=>{
            res.data.forEach(row=>{
                const k=findIbge(row); if(!k) return;
                const c=row[k].toString().trim(); if(c) codeToDataPR.set(c,row);
            });
            setMsg('A carregar dados de temperatura...');
            onDone();
        },
        error:()=>{setStatus('Erro CSV PR/PET','bg-red-100 text-red-800');hideLoad();}
    });

    Papa.parse(CLIMA_SOLO_LOC_URL,{download:true,header:true,skipEmptyLines:true,
        complete:res=>{
            res.data.forEach(row=>{
                const k=findIbge(row); if(!k) return;
                const c=row[k].toString().trim(); if(c) codeToDataLoc.set(c,row);
            });
            setMsg('A carregar dados Köppen/DTA...');
            onDone();
        },
        error:()=>{setStatus('Erro CSV Local','bg-red-100 text-red-800');hideLoad();}
    });

    Papa.parse(CLIMA_SOLO_BR_URL,{download:true,header:true,skipEmptyLines:true,
        complete:res=>{
            res.data.forEach(row=>{
                const k=findIbge(row); if(!k) return;
                const c=row[k].toString().trim(); if(c) codeToDataBr.set(c,row);
            });
            setMsg('CSVs prontos. A carregar malha geográfica...');
            onDone();
        },
        error:()=>{setStatus('Erro CSV Brasil','bg-red-100 text-red-800');hideLoad();}
    });
}

// ==========================================
// PROCESSAMENTO — join por IBGE-Code
// ==========================================
async function processMapData(){
    if(!csvLoaded){ return; }

    let isTemp=false,isCat=false,label='',unit='';
    if     (currentMapVar==='PR')    {label='Precipitação';       unit='mm';}
    else if(currentMapVar==='PET')   {label='Evapotranspiração';  unit='mm';}
    else if(currentMapVar==='TMED')  {label='Temperatura Média';  unit='°C'; isTemp=true;}
    else if(currentMapVar==='KOPPEN'){label='Köppen';             unit='';   isCat=true;}
    else if(currentMapVar==='DTA')   {label='DTA';                unit='mm/m';}

    setStatus(`Processando ${label}…`,'bg-blue-100 text-blue-800');

    const dataMap=new Map(), nameMap=new Map(), cats=new Set();
    let mn=Infinity, mx=-Infinity;
    const uf=currentMapUf.toUpperCase();

    if(currentMapVar==='TMED'){
        const ms=["jan","fev","mar","abr","maio","jun","jul","ago","set","out","nov","dez"];
        codeToDataLoc.forEach((row,code)=>{
            const ke=findEstado(row); if(!ke||row[ke].trim().toUpperCase()!==uf) return;
            const km=findMun(row); if(km) nameMap.set(code,row[km]);
            let s=0,c=0;
            ms.forEach(m=>{const v=parseBR(row[`T_${m}`]);if(!isNaN(v)){s+=v;c++;}});
            if(c>0){const mean=s/c;dataMap.set(code,mean);if(mean<mn)mn=mean;if(mean>mx)mx=mean;}
        });
    } else if(currentMapVar==='KOPPEN'||currentMapVar==='DTA'){
        codeToDataBr.forEach((row,code)=>{
            const ke=findEstado(row); if(!ke||row[ke].trim().toUpperCase()!==uf) return;
            const km=findMun(row); if(km) nameMap.set(code,row[km]);
            if(isCat){
                const kk=Object.keys(row).find(k=>k.toLowerCase().includes('ppen'));
                const raw=kk?row[kk].trim():'';
                if(raw){
                    let cat=raw[0].toUpperCase()+raw.slice(1).toLowerCase();
                    if(cat==='Bsh') cat='BSh'; if(cat==='Bwh') cat='BWh';
                    dataMap.set(code,cat); cats.add(cat);
                }
            } else {
                const kd=Object.keys(row).find(k=>k.toLowerCase().includes('dta'));
                const v=parseBR(kd?row[kd]:null);
                if(!isNaN(v)){dataMap.set(code,v);if(v<mn)mn=v;if(v>mx)mx=v;}
            }
        });
    } else {
        const pfx=currentMapVar==='PR'?'PR_':'PET_';
        codeToDataPR.forEach((row,code)=>{
            const ke=findEstado(row); if(!ke||row[ke].trim().toUpperCase()!==uf) return;
            const km=findMun(row); if(km) nameMap.set(code,row[km]);
            let s=0,has=false;
            for(let i=1;i<=12;i++){
                const v=parseBR(row[`${pfx}${i.toString().padStart(2,'0')}`]);
                if(!isNaN(v)){s+=v;has=true;}
            }
            if(has){dataMap.set(code,s);if(s<mn)mn=s;if(s>mx)mx=s;}
        });
    }
    if(!isCat&&mn===Infinity){mn=0;mx=isTemp?40:1000;}

    console.log(`[${currentMapVar}/${currentMapUf}] dataMap size: ${dataMap.size}`);

    try {
        setStatus('A carregar malha geográfica…','bg-yellow-100 text-yellow-800');
        setMsg(`A carregar malha de ${currentMapUf}…`);

        const geoData = await fetch(GEO_URL(currentMapUf)).then(r=>r.json());

        if(geojsonLayer) map.removeLayer(geojsonLayer);

        geojsonLayer = L.geoJson(geoData, {
            style: feature => {
                // tbrugz/geodata-br: feature.properties.id = "4100103" (7 dígitos)
                const code = (feature.properties.id||'').toString().trim();
                const val  = dataMap.get(code)??null;
                const fill = val===null ? '#dddddd'
                    : isCat ? koppenColor(val)
                    : linearColor(val,mn,mx,isTemp);
                return {fillColor:fill, color:'#555', weight:0.4, fillOpacity:0.82, opacity:1};
            },
            onEachFeature: (feature, layer) => {
                const code = (feature.properties.id||'').toString().trim();
                const val  = dataMap.get(code)??null;
                // nome vem do CSV ou do GeoJSON
                const nome = nameMap.get(code) || feature.properties.name || 'Desconhecido';
                const dv   = val===null ? 'Sem dados'
                    : isCat ? val
                    : val.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+(unit?' '+unit:'');
                layer.bindTooltip(
                    `<div style="text-align:left"><b style="color:#047857">Município:</b> ${nome}<br><b style="color:#047857">${label}:</b> ${dv}</div>`,
                    {sticky:true, className:'custom-tooltip'}
                );
            }
        }).addTo(map);

        map.fitBounds(geojsonLayer.getBounds());
        drawLegend(mn,mx,label,unit,isTemp,isCat,cats);
        setStatus(`${currentMapUf} — ${label} ✓`,'bg-green-100 text-green-800');
        hideLoad();

    } catch(err){
        console.error(err);
        setStatus('Erro ao carregar malha','bg-red-100 text-red-800');
        hideLoad();
    }
}

// ==========================================
// CORES
// ==========================================
function linearColor(val,mn,mx,isTemp){
    if(mx===mn) return isTemp?'red':'blue';
    let r=Math.max(0,Math.min(1,(val-mn)/(mx-mn)));
    let cols=[[255,0,0],[255,165,0],[255,255,0],[0,255,255],[0,0,255]];
    if(isTemp) cols.reverse();
    let sc=r*(cols.length-1), idx=Math.floor(sc);
    if(idx>=cols.length-1){const c=cols[cols.length-1];return `rgb(${c[0]},${c[1]},${c[2]})`;}
    let rm=sc-idx,[r1,g1,b1]=cols[idx],[r2,g2,b2]=cols[idx+1];
    return `rgb(${Math.round(r1+(r2-r1)*rm)},${Math.round(g1+(g2-g1)*rm)},${Math.round(b1+(b2-b1)*rm)})`;
}
function koppenColor(t){
    const c={'af':'#0000FE','am':'#0077FF','aw':'#46A9FA','as':'#A9D6FB',
             'bsh':'#F5A623','bwh':'#E69500','cfa':'#00FF00','cfb':'#00C800',
             'cwa':'#C8FF00','cwb':'#8A9E38'};
    return c[t.toLowerCase()]||'#A0A0A0';
}

// ==========================================
// LEGENDA
// ==========================================
function drawLegend(mn,mx,label,unit,isTemp,isCat,cats){
    document.querySelectorAll('.legend-ctrl').forEach(e=>e.remove());
    const leg=L.control({position:'topright'});
    leg.onAdd=function(){
        const div=L.DomUtil.create('div','info-map legend-map legend-ctrl');
        if(isCat){
            let h='';
            Array.from(cats).sort().forEach(cat=>{
                h+=`<div style="display:flex;align-items:center;margin-bottom:3px">
                    <div style="width:12px;height:12px;background:${koppenColor(cat)};border:1px solid #333;margin-right:5px;border-radius:2px"></div>
                    <span style="font-size:11px">${cat}</span></div>`;
            });
            div.innerHTML=`<div style="font-weight:700;font-size:10px;text-transform:uppercase;color:#047857;margin-bottom:6px">${label}<br>${currentMapUf}</div>${h}`;
        } else {
            const g=isTemp?'linear-gradient(to bottom,red,orange,yellow,cyan,blue)':'linear-gradient(to bottom,blue,cyan,yellow,orange,red)';
            div.innerHTML=`
                <div style="font-weight:700;font-size:10px;text-transform:uppercase;color:#047857;margin-bottom:6px">${label}${unit?' ('+unit+')':''}<br>${currentMapUf}</div>
                <div style="display:flex">
                    <div class="color-bar" style="background:${g}"></div>
                    <div class="legend-labels">
                        <span>${mx.toLocaleString('pt-BR',{maximumFractionDigits:0})}</span>
                        <span>${((mx+mn)/2).toLocaleString('pt-BR',{maximumFractionDigits:0})}</span>
                        <span>${mn.toLocaleString('pt-BR',{maximumFractionDigits:0})}</span>
                    </div>
                </div>`;
        }
        return div;
    };
    leg.addTo(map);
}

// ==========================================
// EVENTOS
// ==========================================
document.getElementById('stateSelect').addEventListener('change',e=>{
    currentMapUf=e.target.value;
    if(csvLoaded) processMapData();
});
document.getElementById('varSelect').addEventListener('change',e=>{
    currentMapVar=e.target.value;
    if(csvLoaded) processMapData();
});

window.onload=()=>{
    if(typeof lucide!=='undefined') lucide.createIcons();
    initMap();
    loadAllCsvs();
};
</script>
</body>
</html>
