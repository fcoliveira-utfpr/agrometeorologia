<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMBITEC Data SH</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .chart-container { height: 300px; }
        #map { height: 650px; }
    </style>
</head>

<body class="bg-slate-50">

<header class="bg-emerald-800 text-white p-6">
    <h1 class="text-2xl font-bold">GAMBITEC Data SH</h1>

    <div class="flex gap-2 mt-4">
        <button id="btn-nav-dash" onclick="switchView('dashboard')" class="bg-emerald-900 px-4 py-2 rounded">SIMEPAR</button>
        <button id="btn-nav-map" onclick="switchView('map')" class="bg-emerald-900 px-4 py-2 rounded">Mapa</button>
        <button id="btn-nav-nasa" onclick="window.location.href='index2.html';" class="bg-emerald-900 px-4 py-2 rounded">NASA</button>
    </div>
</header>

<main id="view-dashboard" class="p-6">

    <div class="flex gap-2 mb-4">
        <input id="date-start" type="date" class="border p-2 rounded">
        <input id="date-end" type="date" class="border p-2 rounded">
        <button id="btn-process" class="bg-green-600 text-white px-4 rounded">Filtrar</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div>Precip: <span id="stat-precip">0</span></div>
        <div>Temp: <span id="stat-temp">0</span></div>
        <div>UR: <span id="stat-umid">0</span></div>
        <div>Dias: <span id="stat-days">0</span></div>
    </div>

    <div class="chart-container mb-6">
        <canvas id="precipChart"></canvas>
    </div>

    <table class="w-full text-sm">
        <thead>
            <tr>
                <th>Data</th><th>Tmax</th><th>Tmin</th><th>Tmed</th><th>UR</th><th>Chuva</th>
            </tr>
        </thead>
        <tbody id="data-table-body"></tbody>
    </table>

</main>

<script>

const CSV_URL = 'https://raw.githubusercontent.com/fcoliveira-utfpr/agrometeorologia/refs/heads/main/SIMEPAR_dados_diario.csv';

let fullData = [];
let filteredData = [];
let chart;

// =========================
// FUNÇÕES SEGURAS
// =========================
function parseBrazilianFloat(val) {
    if (!val) return NaN;
    return parseFloat(val.toString().replace(',', '.'));
}

function safe(v){
    return isNaN(v) ? '-' : v.toFixed(1);
}

// =========================
// PARSER
// =========================
function mapRow(row){
    const findVal = (terms)=>{
        const key = Object.keys(row).find(k =>
            terms.some(t => k.toLowerCase().includes(t))
        );
        return key ? parseBrazilianFloat(row[key]) : NaN;
    };

    return {
        date: new Date(row['Data']),
        dateStr: row['Data'],
        tmax: findVal(['tmax']),
        tmin: findVal(['tmin']),
        tmed: findVal(['tmed']),
        umid: findVal(['ur']),
        precip: findVal(['chuva']),
        rad: findVal(['radiação','radiacao','rad'])
    };
}

// =========================
// LOAD
// =========================
async function loadData(){
    const res = await fetch(CSV_URL);
    const text = await res.text();

    Papa.parse(text, {
        header:true,
        complete: (results)=>{
            fullData = results.data.map(mapRow).filter(d=>d.date);
            fullData.sort((a,b)=>a.date-b.date);

            document.getElementById('date-start').value = fullData[0].date.toISOString().split('T')[0];
            document.getElementById('date-end').value = fullData[fullData.length-1].date.toISOString().split('T')[0];

            processData();
        }
    });
}

// =========================
// PROCESS
// =========================
function processData(){
    const ds = document.getElementById('date-start').value;
    const de = document.getElementById('date-end').value;

    if(!ds || !de){
        alert("Selecione o período");
        return;
    }

    const start = new Date(ds);
    const end = new Date(de);

    filteredData = fullData.filter(d => d.date >= start && d.date <= end);

    updateUI();
    updateChart();
}

// =========================
// UI
// =========================
function updateUI(){
    const tbody = document.getElementById('data-table-body');

    const sum = k => filteredData.reduce((a,b)=>a+(isNaN(b[k])?0:b[k]),0);
    const avg = k => sum(k)/filteredData.length;

    document.getElementById('stat-precip').innerText = safe(sum('precip'));
    document.getElementById('stat-temp').innerText = safe(avg('tmed'));
    document.getElementById('stat-umid').innerText = safe(avg('umid'));
    document.getElementById('stat-days').innerText = filteredData.length;

    tbody.innerHTML = filteredData.map(d=>`
        <tr>
            <td>${d.dateStr}</td>
            <td>${safe(d.tmax)}</td>
            <td>${safe(d.tmin)}</td>
            <td>${safe(d.tmed)}</td>
            <td>${safe(d.umid)}</td>
            <td>${safe(d.precip)}</td>
        </tr>
    `).join('');
}

// =========================
// CHART
// =========================
function updateChart(){
    if(chart) chart.destroy();

    chart = new Chart(document.getElementById('precipChart'), {
        type:'bar',
        data:{
            labels: filteredData.map(d=>d.dateStr),
            datasets:[{
                label:'Chuva',
                data: filteredData.map(d=>d.precip)
            }]
        }
    });
}

// =========================
document.getElementById('btn-process').addEventListener('click', processData);
loadData();

</script>

</body>
</html>
