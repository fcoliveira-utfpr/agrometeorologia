<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMBITEC Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.5);
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #map { height: 650px; width: 100%; border-radius: 8px; z-index: 1; }
        .info-map {
            padding: 8px 12px;
            font: 14px/16px 'Inter', sans-serif;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .legend-map { line-height: 24px; color: #333; }
        .legend-map .color-bar {
            width: 20px; height: 100px; float: left; margin-right: 10px;
            border: 1px solid #333; border-radius: 4px;
        }
        .legend-labels {
            display: flex; flex-direction: column;
            justify-content: space-between; height: 100px;
            font-size: 12px; font-weight: 600;
        }
        .custom-tooltip {
            background: white; border: 1px solid #10b981;
            border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            font-family: 'Inter', sans-serif; font-size: 13px;
        }
        .nav-active { background-color: #047857 !important; border-color: #047857 !important; color: white !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div id="loading-screen" class="loading-overlay">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-emerald-600 mb-4"></div>
        <h2 class="text-xl font-bold text-emerald-800">GAMBITEC Data</h2>
        <p class="text-slate-500 animate-pulse" id="loading-text">A carregar dados climáticos...</p>
    </div>

    <header class="bg-emerald-800 text-white p-4 md:p-6 shadow-lg sticky top-0 z-50 relative">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i data-lucide="leaf" class="w-10 h-10 text-emerald-300"></i>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">GAMBITEC Data</h1>
                    <p class="text-emerald-100 text-sm opacity-90 hidden sm:block">Monitoramento Agrometeorológico</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-2 bg-emerald-900/50 px-4 py-2 rounded-full border border-emerald-700/50">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-200">Sistema Ativo</span>
                </div>
                <button id="menu-toggle-btn" onclick="toggleMenu()" class="p-2 px-4 bg-emerald-900 border border-emerald-700 rounded-xl text-emerald-100 hover:bg-emerald-700 transition-all focus:outline-none flex items-center gap-2">
                    <span class="hidden sm:block text-sm font-bold">MENU</span>
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
        <div id="main-menu" class="hidden absolute top-full right-4 md:right-8 mt-2 w-64 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[100]">
            <div class="p-2 flex flex-col gap-1">
                <button onclick="switchMenu('map')" class="w-full text-left px-4 py-3 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl transition-colors flex items-center gap-3 font-semibold">
                    <i data-lucide="map" class="w-5 h-5"></i> Normais Climatológicas
                </button>
                <button onclick="window.location.href='previsao.html';" class="w-full text-left px-4 py-3 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl transition-colors flex items-center gap-3 font-semibold">
                    <i data-lucide="cloud-sun" class="w-5 h-5"></i> Previsão do Tempo
                </button>
                <button onclick="window.location.href='setedias.html';" class="w-full text-left px-4 py-3 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl transition-colors flex items-center gap-3 font-semibold">
                    <i data-lucide="calendar-days" class="w-5 h-5"></i> Monitoramento 7 dias
                </button>
                <button onclick="window.location.href='nasapower.html';" class="w-full text-left px-4 py-3 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl transition-colors flex items-center gap-3 font-semibold">
                    <i data-lucide="satellite" class="w-5 h-5"></i> Dados NASA-POWER
                </button>
                <button onclick="window.location.href='simeparsh.html';" class="w-full text-left px-4 py-3 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl transition-colors flex items-center gap-3 font-semibold">
                    <i data-lucide="droplets" class="w-5 h-5"></i> SIMEPAR SH
                </button>
            </div>
        </div>
    </header>

    <main id="view-map" class="hidden container mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 space-y-4">
                <div class="glass-card p-6 rounded-2xl shadow-sm border-t-4 border-t-emerald-600">
                    <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2 border-b pb-2">
                        <i data-lucide="map-pin" class="w-5 h-5 text-emerald-600"></i> Parâmetros
                    </h2>
                    <label class="block mb-2 text-sm font-bold text-slate-500 uppercase">Estado (UF):</label>
                    <select id="stateSelect" class="w-full p-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700">
                        <option value="AC">Acre</option><option value="AL">Alagoas</option>
                        <option value="AM">Amazonas</option><option value="BA">Bahia</option>
                        <option value="CE">Ceará</option><option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option><option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option><option value="MG">Minas Gerais</option>
                        <option value="MS">Mato Grosso do Sul</option><option value="MT">Mato Grosso</option>
                        <option value="PA">Pará</option><option value="PB">Paraíba</option>
                        <option value="PE">Pernambuco</option><option value="PI">Piauí</option>
                        <option value="PR" selected>Paraná</option><option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option><option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option><option value="RS">Rio Grande do Sul</option>
                        <option value="SC">Santa Catarina</option><option value="SE">Sergipe</option>
                        <option value="SP">São Paulo</option><option value="TO">Tocantins</option>
                    </select>
                    <label class="block mb-2 mt-4 text-sm font-bold text-slate-500 uppercase">Variável Analisada:</label>
                    <select id="varSelect" class="w-full p-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700">
                        <option value="PR" selected>Precipitação - Chuva Acumulada</option>
                        <option value="PET">Evapotranspiração - ETP</option>
                        <option value="TMED">Temperatura Média Anual</option>
                        <option value="KOPPEN">Clima - Classificação Köppen</option>
                        <option value="DTA">Solo - Disp. Total de Água (DTA)</option>
                    </select>
                    <div class="mt-6 space-y-3">
                        <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4">
                            <h4 class="text-xs font-black text-emerald-800 uppercase tracking-widest mb-1">Fonte de Dados</h4>
                            <p class="text-xs text-emerald-600 leading-relaxed">
                                Clima Köppen (Alvares et al., 2013).<br>
                                Normais Climatológicas 1991–2020 (TerraClimate).<br>
                                DTA mm/m (Atlas Irrigação, 2021).
                            </p>
                        </div>
                        <div id="map-status" class="text-xs text-center py-2 px-3 rounded-lg font-bold bg-slate-100 text-slate-500">
                            A aguardar inicialização...
                        </div>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3">
                <div class="glass-card p-2 rounded-2xl shadow-sm border border-slate-200">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // ESTADO GLOBAL
        // ==========================================
        let isMapInitialized = false;
        let map, geojsonLayer;

        // Dados dos CSVs já indexados por IBGE-Code (string 7 dígitos)
        // codeToData[code] = { nome, valor, ... }
        let codeToDataPR  = new Map(); // Precipitação e ETP
        let codeToDataBr  = new Map(); // Köppen e DTA (clima_solo_br)
        let codeToDataLoc = new Map(); // Temperatura (clima_solo_local)

        let currentMapUf  = "PR";
        let currentMapVar = "PR";

        const PR_PET_CSV_URL      = "https://raw.githubusercontent.com/fcoliveira-utfpr/agrometeorologia/refs/heads/main/TerraClimate_PR_PET_Normal_1991_2020.csv";
        const CLIMA_SOLO_LOC_URL  = "https://raw.githubusercontent.com/fcoliveira-utfpr/agrometeorologia/refs/heads/main/clima_solo_local.csv";
        const CLIMA_SOLO_BR_URL   = "https://raw.githubusercontent.com/fcoliveira-utfpr/agrometeorologia/refs/heads/main/clima_solo_br.csv";

        // ==========================================
        // UTILITÁRIOS
        // ==========================================
        function initIcons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }

        function hideLoadingScreen() {
            const el = document.getElementById('loading-screen');
            if (el) el.style.display = 'none';
        }

        function updateMapStatus(text, cls) {
            const el = document.getElementById('map-status');
            if (el) { el.innerText = text; el.className = `text-xs text-center py-2 px-3 rounded-lg font-bold transition-colors ${cls}`; }
        }

        function parseBrazilianFloat(v) {
            if (v === null || v === undefined || v === '') return NaN;
            let s = v.toString().trim();
            if (s.includes(',') && s.includes('.')) {
                s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
            } else if (s.includes(',')) {
                s = s.replace(',','.');
            }
            return parseFloat(s);
        }

        // Encontra a coluna IBGE-Code (nome pode variar ligeiramente)
        function findIbgeKey(row) {
            return Object.keys(row).find(k => k.toLowerCase().includes('ibge'));
        }

        // Encontra a coluna Estado/UF
        function findEstadoKey(row) {
            return Object.keys(row).find(k => ['estado','uf','estados'].includes(k.toLowerCase().trim()));
        }

        // Encontra nome do município (primeira coluna que contém municipio/município/cidade)
        function findMunicipioKey(row) {
            return Object.keys(row).find(k => {
                const kl = k.toLowerCase().trim();
                return kl.includes('munic') || kl.includes('cidade');
            });
        }

        // ==========================================
        // MENU
        // ==========================================
        function toggleMenu() { document.getElementById('main-menu').classList.toggle('hidden'); }
        function switchMenu(v) { toggleMenu(); switchView(v); }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('main-menu');
            const btn  = document.getElementById('menu-toggle-btn');
            if (menu && !menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target))
                menu.classList.add('hidden');
        });

        // ==========================================
        // INICIALIZAÇÃO DO MAPA
        // ==========================================
        function switchView(viewName) {
            const viewMap = document.getElementById('view-map');
            if (viewName === 'map') {
                if (viewMap) viewMap.classList.remove('hidden');
                if (!isMapInitialized) {
                    setTimeout(() => { initMap(); loadAllCsvs(); isMapInitialized = true; }, 100);
                } else {
                    if (map) map.invalidateSize();
                }
            }
        }

        function initMap() {
            if (map) return;
            map = L.map('map').setView([-24.5, -51.0], 6);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);
        }

        // ==========================================
        // CARGA DOS CSVs — indexados por IBGE-Code
        // ==========================================
        function loadAllCsvs() {
            updateMapStatus("A carregar dados climáticos...", "bg-blue-100 text-blue-800");
            let done = 0;
            const onDone = () => { if (++done === 3) processMapData(); };

            Papa.parse(PR_PET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(res) {
                    res.data.forEach(row => {
                        const k = findIbgeKey(row);
                        if (!k) return;
                        const code = row[k].toString().trim();
                        if (code) codeToDataPR.set(code, row);
                    });
                    onDone();
                },
                error: () => { updateMapStatus("Erro CSV PR/PET", "bg-red-100 text-red-800"); hideLoadingScreen(); }
            });

            Papa.parse(CLIMA_SOLO_LOC_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(res) {
                    res.data.forEach(row => {
                        const k = findIbgeKey(row);
                        if (!k) return;
                        const code = row[k].toString().trim();
                        if (code) codeToDataLoc.set(code, row);
                    });
                    onDone();
                },
                error: () => { updateMapStatus("Erro CSV Local", "bg-red-100 text-red-800"); hideLoadingScreen(); }
            });

            Papa.parse(CLIMA_SOLO_BR_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(res) {
                    res.data.forEach(row => {
                        const k = findIbgeKey(row);
                        if (!k) return;
                        const code = row[k].toString().trim();
                        if (code) codeToDataBr.set(code, row);
                    });
                    onDone();
                },
                error: () => { updateMapStatus("Erro CSV Brasil", "bg-red-100 text-red-800"); hideLoadingScreen(); }
            });
        }

        // ==========================================
        // PROCESSAMENTO — join por IBGE-Code
        // ==========================================
        async function processMapData() {
            let isTemp = false, isCategorical = false, varNameLabel = '', unit = '';
            if      (currentMapVar === 'PR')     { varNameLabel = 'Precipitação';        unit = 'mm'; }
            else if (currentMapVar === 'PET')    { varNameLabel = 'Evapotranspiração';   unit = 'mm'; }
            else if (currentMapVar === 'TMED')   { varNameLabel = 'Temperatura Média';   unit = '°C'; isTemp = true; }
            else if (currentMapVar === 'KOPPEN') { varNameLabel = 'Classificação Köppen'; unit = ''; isCategorical = true; }
            else if (currentMapVar === 'DTA')    { varNameLabel = 'Disp. de Água (DTA)'; unit = 'mm/m'; }

            updateMapStatus(`A sintetizar ${varNameLabel} — ${currentMapUf}...`, "bg-blue-100 text-blue-800");

            // mapDataMap: code (string 7 dígitos) → valor numérico ou string (Köppen)
            const mapDataMap     = new Map();
            const codeToName     = new Map(); // code → nome original do município
            let uniqueCategories = new Set();
            let minVal = Infinity, maxVal = -Infinity;

            const ufUpper = currentMapUf.toUpperCase();

            if (currentMapVar === 'TMED') {
                const meses = ["jan","fev","mar","abr","maio","jun","jul","ago","set","out","nov","dez"];
                codeToDataLoc.forEach((row, code) => {
                    const kEst = findEstadoKey(row);
                    if (!kEst || row[kEst].trim().toUpperCase() !== ufUpper) return;
                    const kMun = findMunicipioKey(row);
                    if (kMun) codeToName.set(code, row[kMun]);
                    let sum = 0, cnt = 0;
                    meses.forEach(m => {
                        const v = parseBrazilianFloat(row[`T_${m}`]);
                        if (!isNaN(v)) { sum += v; cnt++; }
                    });
                    if (cnt > 0) {
                        const mean = sum / cnt;
                        mapDataMap.set(code, mean);
                        if (mean < minVal) minVal = mean;
                        if (mean > maxVal) maxVal = mean;
                    }
                });

            } else if (currentMapVar === 'KOPPEN' || currentMapVar === 'DTA') {
                codeToDataBr.forEach((row, code) => {
                    const kEst = findEstadoKey(row);
                    if (!kEst || row[kEst].trim().toUpperCase() !== ufUpper) return;
                    const kMun = findMunicipioKey(row);
                    if (kMun) codeToName.set(code, row[kMun]);

                    if (isCategorical) {
                        const kK = Object.keys(row).find(k => k.toLowerCase().includes('ppen') || k.toLowerCase().includes('koppen'));
                        const raw = kK ? row[kK].trim() : '';
                        if (raw) {
                            let cat = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
                            if (cat === 'Bsh') cat = 'BSh';
                            if (cat === 'Bwh') cat = 'BWh';
                            mapDataMap.set(code, cat);
                            uniqueCategories.add(cat);
                        }
                    } else {
                        const kD = Object.keys(row).find(k => k.toLowerCase().includes('dta'));
                        const v = parseBrazilianFloat(kD ? row[kD] : null);
                        if (!isNaN(v)) {
                            mapDataMap.set(code, v);
                            if (v < minVal) minVal = v;
                            if (v > maxVal) maxVal = v;
                        }
                    }
                });

            } else {
                // Precipitação (PR) ou ETP (PET)
                const prefix = currentMapVar === 'PR' ? 'PR_' : 'PET_';
                codeToDataPR.forEach((row, code) => {
                    const kEst = findEstadoKey(row);
                    if (!kEst || row[kEst].trim().toUpperCase() !== ufUpper) return;
                    const kMun = findMunicipioKey(row);
                    if (kMun) codeToName.set(code, row[kMun]);
                    let sum = 0, hasData = false;
                    for (let i = 1; i <= 12; i++) {
                        const v = parseBrazilianFloat(row[`${prefix}${i.toString().padStart(2,'0')}`]);
                        if (!isNaN(v)) { sum += v; hasData = true; }
                    }
                    if (hasData) {
                        mapDataMap.set(code, sum);
                        if (sum < minVal) minVal = sum;
                        if (sum > maxVal) maxVal = sum;
                    }
                });
            }

            if (!isCategorical && minVal === Infinity) { minVal = 0; maxVal = isTemp ? 40 : 1000; }

            console.log(`[${currentMapVar}/${currentMapUf}] mapDataMap size: ${mapDataMap.size}`);

            try {
                updateMapStatus("A carregar malha IBGE...", "bg-yellow-100 text-yellow-800");

                // ÚNICA chamada de rede ao IBGE: apenas o GeoJSON da malha
                const geoUrl = `https://servicodados.ibge.gov.br/api/v3/malhas/estados/${currentMapUf}?formato=application/vnd.geo+json&resolucao=5`;
                const geoData = await fetchWithFallback(geoUrl);

                if (geojsonLayer) map.removeLayer(geojsonLayer);

                geojsonLayer = L.geoJson(geoData, {
                    style: function(feature) {
                        // codarea no GeoJSON é string de 7 dígitos — join direto
                        const code = (feature.properties.codarea || '').toString().trim();
                        const valor = mapDataMap.get(code) ?? null;
                        const fillColor = valor === null ? '#dddddd'
                            : isCategorical ? getKoppenColor(valor)
                            : getLinearColormap(valor, minVal, maxVal, isTemp);
                        return { fillColor, color: '#333', weight: 0.4, fillOpacity: 0.82, opacity: 1 };
                    },
                    onEachFeature: function(feature, layer) {
                        const code = (feature.properties.codarea || '').toString().trim();
                        const valor = mapDataMap.get(code) ?? null;
                        const nome  = codeToName.get(code) || feature.properties.nome || 'Desconhecido';
                        const displayVal = valor === null ? 'Sem dados'
                            : isCategorical ? valor
                            : valor.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + (unit ? ' ' + unit : '');
                        layer.bindTooltip(
                            `<div style="text-align:left"><b style="color:#047857">Município:</b> ${nome}<br><b style="color:#047857">${varNameLabel}:</b> ${displayVal}</div>`,
                            { sticky: true, className: 'custom-tooltip' }
                        );
                    }
                }).addTo(map);

                map.fitBounds(geojsonLayer.getBounds());
                updateMapLegend(minVal, maxVal, varNameLabel, unit, isTemp, isCategorical, uniqueCategories);
                updateMapStatus(`Mapa ${currentMapUf} — ${varNameLabel} carregado!`, "bg-green-100 text-green-800");
                hideLoadingScreen();

            } catch (err) {
                console.error("Erro ao carregar malha:", err);
                updateMapStatus("Erro ao acessar malha IBGE", "bg-red-100 text-red-800");
                hideLoadingScreen();
            }
        }

        // Fetch com dois fallbacks CORS
        async function fetchWithFallback(url) {
            const proxies = [
                url,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];
            for (const u of proxies) {
                try {
                    const r = await fetch(u);
                    if (r.ok) return await r.json();
                } catch(e) { console.warn('Proxy falhou:', u, e); }
            }
            throw new Error("Todos os proxies falharam para: " + url);
        }

        // ==========================================
        // CORES
        // ==========================================
        function getLinearColormap(value, vmin, vmax, isTemp) {
            if (value === null || isNaN(value)) return '#dddddd';
            if (vmax === vmin) return isTemp ? 'red' : 'blue';
            let ratio = Math.max(0, Math.min(1, (value - vmin) / (vmax - vmin)));
            let colors = [[255,0,0],[255,165,0],[255,255,0],[0,255,255],[0,0,255]];
            if (isTemp) colors.reverse();
            let scaled = ratio * (colors.length - 1);
            let idx = Math.floor(scaled);
            if (idx >= colors.length - 1) { const c = colors[colors.length-1]; return `rgb(${c[0]},${c[1]},${c[2]})`; }
            let rem = scaled - idx;
            let [r1,g1,b1] = colors[idx], [r2,g2,b2] = colors[idx+1];
            return `rgb(${Math.round(r1+(r2-r1)*rem)},${Math.round(g1+(g2-g1)*rem)},${Math.round(b1+(b2-b1)*rem)})`;
        }

        function getKoppenColor(type) {
            const c = {
                'af':'#0000FE','am':'#0077FF','aw':'#46A9FA','as':'#A9D6FB',
                'bsh':'#F5A623','bwh':'#E69500',
                'cfa':'#00FF00','cfb':'#00C800','cwa':'#C8FF00','cwb':'#8A9E38'
            };
            return c[type.toLowerCase()] || '#A0A0A0';
        }

        // ==========================================
        // LEGENDA
        // ==========================================
        function updateMapLegend(min, max, label, unit, isTemp, isCategorical, categories) {
            document.querySelectorAll('.legend-control').forEach(el => el.remove());
            const legend = L.control({position: 'topright'});
            legend.onAdd = function() {
                const div = L.DomUtil.create('div', 'info-map legend-map legend-control');
                if (isCategorical) {
                    let html = '';
                    Array.from(categories).sort().forEach(cat => {
                        html += `<div style="display:flex;align-items:center;margin-bottom:4px">
                            <div style="width:14px;height:14px;background:${getKoppenColor(cat)};border:1px solid #333;margin-right:6px;border-radius:2px"></div>
                            <span>${cat}</span></div>`;
                    });
                    div.innerHTML = `<div style="font-weight:bold;margin-bottom:8px;font-size:11px;text-transform:uppercase;color:#047857">${label}<br>${currentMapUf}</div>${html}`;
                } else {
                    const gradient = isTemp
                        ? "linear-gradient(to bottom,red,orange,yellow,cyan,blue)"
                        : "linear-gradient(to bottom,blue,cyan,yellow,orange,red)";
                    div.innerHTML = `
                        <div style="font-weight:bold;margin-bottom:8px;font-size:11px;text-transform:uppercase;color:#047857">${label} (${unit})<br>${currentMapUf}</div>
                        <div style="display:flex">
                            <div class="color-bar" style="background:${gradient}"></div>
                            <div class="legend-labels text-slate-600">
                                <span>${max.toLocaleString('pt-BR',{maximumFractionDigits:1})}</span>
                                <span>${((max+min)/2).toLocaleString('pt-BR',{maximumFractionDigits:1})}</span>
                                <span>${min.toLocaleString('pt-BR',{maximumFractionDigits:1})}</span>
                            </div>
                        </div>`;
                }
                return div;
            };
            legend.addTo(map);
        }

        // ==========================================
        // EVENTOS
        // ==========================================
        document.getElementById('stateSelect').addEventListener('change', e => {
            currentMapUf = e.target.value;
            processMapData();
        });

        document.getElementById('varSelect').addEventListener('change', e => {
            currentMapVar = e.target.value;
            processMapData();
        });

        window.onload = () => { initIcons(); switchView('map'); };
    </script>
</body>
</html>
