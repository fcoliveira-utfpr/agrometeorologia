<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMBITEC Data SHo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-green: #2d5a27;
            --secondary-green: #4caf50;
            --bg-light: #f0f4f0;
        }
        body { background-color: var(--bg-light); }
        .header-agro { background-color: var(--primary-green); }
        .data-card { background: #ffffff; border-left: 4px solid var(--secondary-green); transition: transform 0.2s; }
        .data-card:hover { transform: scale(1.02); }
        .card-temp { border-color: #ff9800; }
        .card-hum { border-color: #2196f3; }
        .card-rain { border-color: #4caf50; }
        select:disabled { cursor: not-allowed; opacity: 0.6; }
        .btn-voltar { background-color: #666; transition: all 0.3s; }
        .btn-voltar:hover { background-color: #444; }
        .btn-csv { background-color: var(--secondary-green); transition: all 0.3s; }
        .btn-csv:hover { background-color: var(--primary-green); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden">
        <!-- Cabeçalho Estilo Agro -->
        <div class="header-agro p-6 text-white flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold italic">AgroClima Pro</h1>
                <p class="text-green-200 text-sm">Monitorização Técnica de Precisão</p>
            </div>
            <div id="areaVoltar" class="mt-4 md:mt-0 flex gap-2">
                <!-- Botão CSV (oculto inicialmente) -->
                <button id="btnDownloadCSV" onclick="exportToCSV()" class="hidden btn-csv text-white px-4 py-2 rounded-full font-bold shadow-md flex items-center gap-2 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Baixar CSV
                </button>
                <button onclick="redirectToExternal()" class="btn-voltar text-white px-6 py-2 rounded-full font-bold shadow-md flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                    Voltar para o Portal
                </button>
            </div>
        </div>

        <div class="p-6">
            <!-- Área de Seleção -->
            <div id="selectionArea" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase mb-1">Estado (UF) ou País</label>
                    <select id="stateSelect" onchange="fetchCities()" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-green-500 outline-none transition-colors">
                        <option value="">Selecione...</option>
                        <option value="PY">Paraguai (PY)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase mb-1">Município</label>
                    <select id="citySelect" onchange="fetchMeteoData()" disabled class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-green-500 outline-none transition-colors">
                        <option value="">Selecione primeiro...</option>
                    </select>
                </div>
            </div>

            <!-- Resultados -->
            <div id="results" class="hidden space-y-6 animate-fade-in">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Temperatura -->
                    <div class="data-card card-temp p-5 rounded-lg shadow-md">
                        <h3 class="text-gray-500 text-xs font-black uppercase mb-2">Temperatura & Sensação</h3>
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-400 text-[10px] uppercase">Média Real (Até agora)</p>
                                <p id="avgTemp" class="text-3xl font-black text-orange-600">--</p>
                            </div>
                            <div class="text-right border-l-2 border-orange-100 pl-4">
                                <p class="text-gray-400 text-[10px] uppercase">Sensação</p>
                                <p id="avgFeels" class="text-xl font-bold text-orange-400">--</p>
                            </div>
                        </div>
                    </div>

                    <!-- Umidade -->
                    <div class="data-card card-hum p-5 rounded-lg shadow-md">
                        <h3 class="text-gray-500 text-xs font-black uppercase mb-2">Umidade Relativa</h3>
                        <p class="text-gray-400 text-[10px] uppercase">Média do Ar</p>
                        <p id="avgHumidity" class="text-3xl font-black text-blue-600">--</p>
                    </div>

                    <!-- Chuva -->
                    <div class="data-card card-rain p-5 rounded-lg shadow-md">
                        <h3 class="text-gray-500 text-xs font-black uppercase mb-2">Precipitação Total</h3>
                        <p class="text-gray-400 text-[10px] uppercase">Acumulado Realizado</p>
                        <p id="totalRain" class="text-3xl font-black text-green-700">--</p>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 border-2 border-dashed border-gray-200 rounded-xl">
                    <p class="text-[10px] text-gray-500 mb-3 text-center uppercase font-black tracking-widest">Gráfico de Variação Realizada (Últimos 7 dias até agora)</p>
                    <canvas id="weatherChart" height="110"></canvas>
                </div>
            </div>

            <div id="status" class="mt-4 text-center text-xs font-bold text-gray-400 uppercase tracking-tighter"></div>
        </div>
    </div>

    <script>
        let chartInstance = null;
        let lastProcessedData = null; // Armazena dados para o CSV
        const stateSelect = document.getElementById('stateSelect');
        const citySelect = document.getElementById('citySelect');

        const pyCities = [
            "Asunción", "Ciudad del Este", "Encarnación", "Luque", "Pedro Juan Caballero", 
            "San Lorenzo", "Lambaré", "Fernando de la Mora", "Limpio", "Mariano Roque Alonso",
            "Capiatá", "Villa Elisa", "Itauguá", "Salto del Guairá", "Caaguazú", "Coronel Oviedo"
        ];

        function redirectToExternal() {
            window.location.href = "https://fcoliveira-utfpr.github.io/agrometeorologia/index.html";
        }

        async function loadStates() {
            try {
                const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
                const states = await response.json();
                states.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state.sigla;
                    option.textContent = state.nome;
                    stateSelect.appendChild(option);
                });
                stateSelect.value = "PR";
                await fetchCities("Santa Helena");
            } catch (err) { console.error(err); }
        }

        async function fetchCities(defaultCityName = null) {
            const uf = stateSelect.value;
            if (!uf) { citySelect.disabled = true; return; }
            citySelect.disabled = true;
            citySelect.innerHTML = '<option value="">A carregar...</option>';

            try {
                if (uf === "PY") {
                    citySelect.innerHTML = '<option value="">Selecione cidade (PY)...</option>';
                    pyCities.sort().forEach(city => {
                        const option = document.createElement('option');
                        option.value = city; option.textContent = city;
                        citySelect.appendChild(option);
                    });
                } else {
                    const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);
                    const cities = await response.json();
                    citySelect.innerHTML = '<option value="">Selecione município...</option>';
                    cities.forEach(city => {
                        const option = document.createElement('option');
                        option.value = city.nome; option.textContent = city.nome;
                        citySelect.appendChild(option);
                    });
                }
                citySelect.disabled = false;
                if (defaultCityName) { citySelect.value = defaultCityName; fetchMeteoData(); }
            } catch (err) { console.error(err); }
        }

        async function fetchMeteoData() {
            const cityName = citySelect.value;
            const uf = stateSelect.value;
            if (!cityName || !uf) return;

            document.getElementById('status').innerText = `Sincronizando dados de ${cityName}...`;
            
            try {
                const countryCode = uf === "PY" ? "PY" : "BR";
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=5&language=pt&format=json`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();
                const location = geoData.results?.find(r => r.country_code === countryCode) || geoData.results?.[0];

                if (!location) throw new Error("Localização não encontrada.");

                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation&past_days=7&forecast_days=1&timezone=auto`;
                const weatherRes = await fetch(weatherUrl);
                const weatherData = await weatherRes.json();

                processHourlyResults(weatherData.hourly);
            } catch (err) {
                document.getElementById('status').innerText = "Erro: " + err.message;
            }
        }

        function processHourlyResults(hourly) {
            const now = new Date();
            
            // Filtrar apenas dados que já ocorreram
            const filteredIndices = hourly.time
                .map((t, idx) => ({ time: new Date(t), index: idx }))
                .filter(item => item.time <= now)
                .map(item => item.index);

            const times = filteredIndices.map(i => hourly.time[i]);
            const temps = filteredIndices.map(i => hourly.temperature_2m[i]);
            const feels = filteredIndices.map(i => hourly.apparent_temperature[i]);
            const hums = filteredIndices.map(i => hourly.relative_humidity_2m[i]);
            const rains = filteredIndices.map(i => hourly.precipitation[i]);

            // Guardar para exportação
            lastProcessedData = { times, temps, feels, hums, rains, cityName: citySelect.value };

            const labels = times.map(t => {
                const date = new Date(t);
                return `${date.getDate()}/${date.getMonth()+1} ${date.getHours()}h`;
            });

            document.getElementById('avgTemp').innerText = `${(temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1)}°C`;
            document.getElementById('avgFeels').innerText = `${(feels.reduce((a, b) => a + b, 0) / feels.length).toFixed(1)}°C`;
            document.getElementById('avgHumidity').innerText = `${(hums.reduce((a, b) => a + b, 0) / hums.length).toFixed(0)}%`;
            document.getElementById('totalRain').innerText = `${rains.reduce((a, b) => a + b, 0).toFixed(1)} mm`;
            
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('btnDownloadCSV').classList.remove('hidden');
            document.getElementById('status').innerText = "Dados Processados.";
            renderChart(labels, temps, feels, hums, rains);
        }

        function renderChart(labels, temps, feels, hums, rains) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Temp (°C)', data: temps, borderColor: '#ff9800', backgroundColor: '#ff980011', yAxisID: 'yTemp', pointRadius: 0, fill: true, tension: 0.4 },
                        { label: 'Sensação (°C)', data: feels, borderColor: '#ffb74d', borderDash: [3, 3], yAxisID: 'yTemp', pointRadius: 0, tension: 0.4 },
                        { label: 'Umidade (%)', data: hums, borderColor: '#2196f3', yAxisID: 'yHum', pointRadius: 0, tension: 0.4 },
                        { label: 'Chuva (mm)', data: rains, type: 'bar', backgroundColor: '#4caf50', yAxisID: 'yRain' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 14, font: { size: 9 } } },
                        yTemp: { type: 'linear', position: 'left', ticks: { font: { size: 9 } } },
                        yHum: { type: 'linear', position: 'right', min: 0, max: 100, grid: { drawOnChartArea: false }, ticks: { font: { size: 9 } } },
                        yRain: { type: 'linear', display: false, min: 0 }
                    }
                }
            });
        }

        function exportToCSV() {
            if (!lastProcessedData) return;
            
            const { times, temps, feels, hums, rains, cityName } = lastProcessedData;
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Data/Hora;Temperatura(C);Sensacao(C);Umidade(%);Chuva(mm)\n";

            times.forEach((t, i) => {
                const date = new Date(t).toLocaleString('pt-BR');
                csvContent += `${date};${temps[i]};${feels[i]};${hums[i]};${rains[i]}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `meteo_${cityName.replace(/\s+/g, '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = loadStates;
    </script>
</body>
</html>
